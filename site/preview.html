<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สสว. SME Marketplace — Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root {
  --primary-blue: #2563EB;
  --brand-blue: #1D4ED8;
  --brand-blue-dark: #1E40AF;
  --gov-navy: #1E3A8A;
  --slate-dark: #1E293B;
  --slate-body: #475569;
  --neutral-bg: #F8FAFC;
  --surface-white: #FFFFFF;
  --emerald-verified: #059669;
  --emerald-bg: #ECFDF5;
  --emerald-border: #A7F3D0;
  --amber-promo: #F97316;
  --amber-solid: #FBBF24;
  --amber-text: #F59E0B;
  --border-subtle: #E2E8F0;
  --danger: #EF4444;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--neutral-bg);
  font-family: 'Kanit', system-ui, sans-serif;
  color: var(--slate-dark);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand-blue); text-decoration: none; }
input, select, button, textarea { font-family: inherit; }
button { border: none; background: none; cursor: pointer; }
img { max-width: 100%; display: block; }

::-webkit-scrollbar { height: 8px; width: 8px; }
::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 4px; }

.num { font-family: 'Satoshi', 'Kanit', sans-serif; }

@keyframes pulseDot { 0%, 100% { opacity: 1 } 50% { opacity: .35 } }

.lucide-icon { width: 50%; height: 50%; stroke: currentColor; stroke-width: 2; fill: none; }

.page { min-height: 100vh; display: flex; flex-direction: column; background: var(--neutral-bg); }

/* ---------- Utility bar ---------- */
.utility-bar { background: var(--brand-blue); color: #C7D2FE; font-size: 12.5px; }
.utility-bar .wrap { max-width: 1280px; margin: 0 auto; padding: 0 16px; height: 36px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.utility-left { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.utility-left .gov-label { display: flex; align-items: center; gap: 6px; color: #fff; font-weight: 500; }
.utility-left a { color: #C7D2FE; }
.utility-left a:hover { color: #fff; }
.utility-sep { opacity: .4; }
.utility-right { display: flex; align-items: center; gap: 10px; }
.lang-active { font-family: 'Satoshi', 'Kanit', sans-serif; font-weight: 700; color: #fff; background: rgba(255,255,255,.14); padding: 3px 8px; border-radius: 5px; }
.lang-inactive { font-family: 'Satoshi', 'Kanit', sans-serif; color: #C7D2FE; }

/* ---------- Header ---------- */
.site-header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid var(--border-subtle); }
.header-row { max-width: 1280px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; cursor: pointer; flex-shrink: 0; }
.brand-mark { height: 34px; width: auto; display: block; }
.brand-text { line-height: 1.15; }
.brand-title { font-size: 15px; font-weight: 600; color: var(--slate-dark); }
.brand-domain { font-size: 10.5px; color: var(--slate-body); font-family: 'Satoshi', 'Kanit', sans-serif; letter-spacing: .04em; }

.menu-btn { display: flex; align-items: center; gap: 7px; background: #fff; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 9px 13px; font-size: 13.5px; color: #334155; cursor: pointer; flex-shrink: 0; }
.menu-btn:hover { border-color: var(--brand-blue); color: var(--brand-blue); }
.menu-icon { display: grid; gap: 3px; }
.menu-icon span { display: block; width: 14px; height: 2px; background: currentColor; border-radius: 2px; }

.search-wrap { flex: 1; position: relative; min-width: 120px; }
.search-input { width: 100%; height: 42px; border: 1.5px solid var(--border-subtle); border-radius: 10px; padding: 0 44px 0 14px; font-size: 14px; color: var(--slate-dark); background: var(--neutral-bg); outline: none; }
.search-input:focus { border-color: var(--brand-blue); background: #fff; }
.search-btn { position: absolute; right: 5px; top: 5px; width: 34px; height: 32px; border-radius: 7px; background: var(--brand-blue); display: grid; place-items: center; color: #fff; font-size: 13px; }
.suggest-panel { position: absolute; top: 48px; left: 0; right: 0; background: #fff; border: 1px solid var(--border-subtle); border-radius: 12px; box-shadow: 0 16px 40px rgba(15,23,42,.12); padding: 8px; z-index: 60; }
.suggest-label { font-size: 11px; color: var(--slate-body); padding: 6px 10px; }
.suggest-item { padding: 9px 10px; border-radius: 8px; font-size: 13.5px; color: #334155; cursor: pointer; }
.suggest-item:hover { background: #F1F5F9; }

.action-hub { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.hub-icon { width: 40px; height: 40px; border-radius: 9px; display: grid; place-items: center; font-size: 12px; color: var(--slate-body); cursor: pointer; position: relative; }
.hub-icon:hover { background: #F1F5F9; }
.hub-badge { position: absolute; top: 2px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--danger); color: #fff; font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.hub-sep { width: 1px; height: 24px; background: var(--border-subtle); margin: 0 4px; }
.hub-profile { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.hub-avatar { width: 32px; height: 32px; border-radius: 50%; background: #DBEAFE; color: var(--brand-blue); display: grid; place-items: center; font-size: 13px; }
.hub-name { font-size: 13px; color: #334155; line-height: 1.2; }
.hub-verified { font-size: 10.5px; color: var(--emerald-verified); }

.menu-panel { border-top: 1px solid var(--border-subtle); background: #fff; }
.menu-grid { max-width: 1280px; margin: 0 auto; padding: 18px 16px; display: grid; gap: 10px; }
.menu-cell { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 10px; cursor: pointer; }
.menu-cell:hover { background: #F1F5F9; }
.menu-glyph { width: 34px; height: 34px; border-radius: 9px; background: #EFF6FF; color: var(--brand-blue); display: grid; place-items: center; font-size: 18px; flex-shrink: 0; }
.menu-name { font-size: 13.5px; color: #334155; }

/* ---------- Shared layout ---------- */
.container { max-width: 1280px; margin: 0 auto; padding: 0 16px; }
.section { max-width: 1280px; margin: 0 auto; padding: 20px 16px 0; }
.card { background: #fff; border: 1px solid var(--border-subtle); border-radius: 16px; }

/* ---------- Hero ---------- */
.hero-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.hero-main { position: relative; border-radius: 16px; overflow: hidden; background: var(--border-subtle); aspect-ratio: 2.4/1; min-height: 220px; }
.hero-track { display: flex; height: 100%; transition: transform .65s cubic-bezier(.65,0,.35,1); will-change: transform; }
.hero-slide { position: relative; flex: 0 0 100%; height: 100%; }
.hero-caption { position: absolute; left: 0; bottom: 0; right: 0; padding: 24px; background: linear-gradient(to top, rgba(15,23,42,.82), rgba(15,23,42,0)); pointer-events: none; }
.hero-tag { display: inline-flex; align-items: center; gap: 5px; background: var(--amber-promo); color: #fff; font-weight: 700; letter-spacing: .2px; font-size: 11.5px; padding: 5px 12px 5px 9px; border-radius: 999px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(154,52,18,.4), 0 0 0 1px rgba(255,255,255,.22) inset; }
.hero-tag .pill-icon { width: 12px; height: 12px; }
.hero-title { color: #fff; font-size: 26px; font-weight: 600; line-height: 1.25; }
.hero-sub { color: var(--border-subtle); font-size: 14px; margin-top: 6px; }
.hero-cta { display: inline-flex; align-items: center; gap: 7px; margin-top: 16px; background: #fff; color: var(--brand-blue); border: none; font-size: 14px; padding: 11px 22px; border-radius: 10px; cursor: pointer; pointer-events: auto; box-shadow: 0 4px 14px rgba(15,23,42,.28); transition: background .2s, color .2s, transform .2s, box-shadow .2s; }
.hero-cta .pill-icon { width: 14px; height: 14px; transition: transform .2s; }
.hero-cta:hover { background: var(--brand-blue-dark); color: #fff; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(15,23,42,.32); }
.hero-cta:hover .pill-icon { transform: translateX(3px); }
.hero-arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.92); border: none; color: var(--brand-blue); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; z-index: 3; box-shadow: 0 3px 12px rgba(15,23,42,.28); transition: opacity .25s, background .2s, transform .2s; }
.hero-arrow .pill-icon { width: 18px; height: 18px; stroke-width: 2.4; }
.hero-arrow-left { left: 14px; }
.hero-arrow-right { right: 14px; }
.hero-main:hover .hero-arrow { opacity: 1; }
.hero-arrow:hover { background: #fff; transform: translateY(-50%) scale(1.08); }
.hero-arrow-left:hover .pill-icon { transform: translateX(-1px); }
.hero-arrow-right:hover .pill-icon { transform: translateX(1px); }
.hero-dots { position: absolute; bottom: 14px; right: 16px; display: flex; gap: 6px; z-index: 2; }
.hero-dot { height: 7px; border-radius: 4px; cursor: pointer; transition: width .25s, background .25s; }

/* ---------- Placeholder image slot ---------- */
.img-slot { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: var(--slate-body); background: #F1F5F9; padding: 6px; line-height: 1.4; }
.img-slot.static { position: static; width: 100%; height: 100%; }
.img-slot-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #F1F5F9; }

/* ---------- Category pills ---------- */
.cat-grid { padding: 16px; display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; }
.cat-grid::-webkit-scrollbar { display: none; }
.cat-cell { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 16px 8px 10px; border: 1px solid var(--border-subtle); border-radius: 999px; cursor: pointer; white-space: nowrap; background: #fff; }
.cat-cell:hover { border-color: var(--brand-blue); background: #EFF6FF; }
.cat-cell.active { border-color: var(--brand-blue); background: var(--brand-blue); }
.cat-cell.active .cat-name { color: #fff; }
.cat-cell.active .cat-glyph { background: rgba(255,255,255,.2); color: #fff; }
.cat-glyph { width: 28px; height: 28px; border-radius: 999px; background: #EFF6FF; color: var(--brand-blue); display: grid; place-items: center; font-size: 15px; flex: 0 0 auto; }
.cat-glyph svg { width: 16px; height: 16px; }
.cat-name { font-size: 13px; color: #334155; line-height: 1.3; font-weight: 500; }

/* ---------- Flash sale ---------- */
.flash-head { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 18px 20px; background: var(--brand-blue); flex-wrap: wrap; border-radius: 16px 16px 0 0; }
.flash-left { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.flash-badge { display: inline-flex; align-items: center; gap: 5px; background: var(--amber-promo); color: #fff; font-size: 12.5px; font-weight: 700; letter-spacing: .2px; padding: 5px 13px 5px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(154,52,18,.35), 0 0 0 1px rgba(255,255,255,.22) inset; }
.flash-badge .pill-icon { width: 13px; height: 13px; }
.flash-title { font-size: 20px; font-weight: 600; color: #fff; }
.flash-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.flash-label { font-size: 12.5px; color: #DBEAFE; }
.countdown { display: flex; gap: 8px; perspective: 300px; }
.count-box { background: rgba(255,255,255,.16); border-radius: 10px; padding: 7px 11px; text-align: center; min-width: 56px; position: relative; overflow: hidden; }
.count-num { font-family: 'Satoshi', 'Kanit', sans-serif; font-weight: 700; font-size: 18px; color: #fff; display: inline-block; transform-style: preserve-3d; }
.count-unit { font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 10px; color: #BFDBFE; letter-spacing: .08em; }

@keyframes flipDigit {
  0% { transform: rotateX(90deg); opacity: 0; }
  60% { transform: rotateX(-10deg); opacity: 1; }
  100% { transform: rotateX(0deg); opacity: 1; }
}
.count-num.flip { animation: flipDigit .5s cubic-bezier(.45, 0, .55, 1); transform-origin: 50% 50%; }
.flash-link { font-size: 13.5px; color: #fff; text-decoration: underline; }
.flash-scroll { display: flex; gap: 14px; padding: 18px 20px; overflow-x: auto; }

/* ---------- Product cards ---------- */
.product-card { cursor: pointer; border: 1px solid var(--border-subtle); border-radius: 12px; overflow: visible; background: #fff; display: flex; flex-direction: column; position: relative; transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease; }
.product-card:hover { border-color: #BFDBFE; transform: translateY(-2px); box-shadow: 0 6px 14px rgba(191,219,254,.75), 0 1px 3px rgba(15,23,42,.06); }
.flash-card { flex: 0 0 188px; }
.product-media { position: relative; aspect-ratio: 1/1; background: #F1F5F9; overflow: hidden; border-radius: 12px 12px 0 0; }
.disc-badge { position: absolute; top: -1px; left: -7px; background: #E94560; color: #fff; font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 15px; font-weight: 800; padding: 6px 15px 8px 12px; border-radius: 0 18px 18px 0; box-shadow: 0 3px 8px rgba(0,0,0,.18); z-index: 2; }
.disc-badge::after { content: ''; position: absolute; left: 0; bottom: -6px; width: 0; height: 0; border-left: 6px solid transparent; border-top: 6px solid #A81F38; }
.product-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
.flash-card .product-body { padding: 10px 12px 12px; }
.feed-card .product-body { padding: 11px 12px 13px; flex: 1; }
.verified-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--emerald-bg); color: var(--emerald-verified); border: 1px solid var(--emerald-border); font-size: 10.5px; padding: 2px 7px; border-radius: 5px; align-self: flex-start; }
.product-name { font-size: 13px; color: #334155; line-height: 1.35; height: 36px; overflow: hidden; }
.feed-card .product-name { font-size: 13.5px; line-height: 1.4; height: 38px; }
.price-row { display: flex; align-items: baseline; gap: 7px; }
.feed-card .price-row { margin-top: auto; }
.price-now { font-family: 'Satoshi', 'Kanit', sans-serif; font-weight: 700; font-size: 16px; color: var(--slate-dark); }
.feed-card .price-now { font-size: 17px; }
.price-old { font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 12px; color: #94A3B8; text-decoration: line-through; }
.stock-track { height: 6px; border-radius: 4px; background: #FEF3C7; overflow: hidden; }
.stock-fill { height: 100%; background: var(--amber-text); }
.stock-text { font-size: 11.5px; color: var(--slate-body); }
.meta-row { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--slate-body); font-family: 'Satoshi', 'Kanit', sans-serif; }
.meta-sep { color: #CBD5E1; }
.province-text { font-size: 11.5px; color: var(--slate-body); }

/* ---------- Champions ---------- */
.champ-card { border: 1px solid var(--border-subtle); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.champ-head { display: flex; align-items: center; gap: 11px; }
.champ-logo { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; background: #F1F5F9; flex-shrink: 0; position: relative; }
.champ-name { font-size: 14px; font-weight: 500; color: var(--slate-dark); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.champ-province { font-size: 11.5px; color: var(--slate-body); }
.champ-blurb { font-size: 12.5px; color: var(--slate-body); line-height: 1.5; }
.champ-stats { display: flex; gap: 14px; font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 12px; color: #334155; border-top: 1px solid var(--border-subtle); padding-top: 10px; }
.chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 7px 14px; border-radius: 20px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-subtle); background: #fff; color: var(--slate-body); }
.chip.active { border-color: var(--brand-blue); background: #EFF6FF; color: var(--brand-blue); }
.chip.small { padding: 6px 12px; border-radius: 18px; font-size: 12.5px; }

/* ---------- Related images ---------- */
.related-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
.related-thumb { position: relative; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: #F1F5F9; border: 1px solid var(--border-subtle); cursor: pointer; }
.related-thumb:hover { border-color: var(--brand-blue); }

/* ---------- Feed ---------- */
.feed-grid { display: grid; gap: 14px; }
.feed-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
.feed-title { font-size: 19px; font-weight: 600; }
.feed-count { font-size: 13px; color: var(--slate-body); font-family: 'Satoshi', 'Kanit', sans-serif; }
.load-more-wrap { display: flex; justify-content: center; margin-top: 26px; }

/* ---------- Buttons ---------- */
.btn { font-size: 14px; padding: 11px 26px; border-radius: 10px; cursor: pointer; }
.btn-primary { background: var(--brand-blue); border: none; color: #fff; }
.btn-primary:hover { background: var(--brand-blue-dark); }
.btn-outline { background: #fff; border: 1.5px solid var(--brand-blue); color: var(--brand-blue); }
.btn-outline:hover { background: #EFF6FF; }
.btn-outline.solid-hover:hover { background: var(--brand-blue-dark); color: #fff; }
.btn-block { width: 100%; }
.btn-green { background: var(--emerald-verified); border: none; color: #fff; }
.btn-green:hover { background: #047857; }

/* ---------- Breadcrumb / PDP ---------- */
.breadcrumb { font-size: 12.5px; color: var(--slate-body); margin-bottom: 14px; }
.breadcrumb .crumb-link { cursor: pointer; color: var(--brand-blue); }
.crumb-current { color: #334155; }

.pdp-grid { display: grid; gap: 22px; align-items: start; }
.gallery-card { background: #fff; border: 1px solid var(--border-subtle); border-radius: 14px; padding: 14px; width: 100%; margin: 0 auto; }
.gallery-main { aspect-ratio: 1/1; border-radius: 10px; overflow: hidden; background: #F1F5F9; position: relative; }
.gallery-thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
.gallery-thumb { aspect-ratio: 1/1; border-radius: 8px; overflow: hidden; border: 1.5px solid var(--border-subtle); background: #F1F5F9; position: relative; }
.gallery-thumb.active { border-color: var(--brand-blue); }

.pdp-info-card { background: #fff; border: 1px solid var(--border-subtle); border-radius: 14px; padding: 20px; }
.pdp-badges { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.badge-verified { display: inline-flex; align-items: center; gap: 5px; background: var(--emerald-bg); color: var(--emerald-verified); border: 1px solid var(--emerald-border); font-size: 12px; padding: 4px 9px; border-radius: 6px; }
.badge-cat { background: #EFF6FF; color: var(--brand-blue); border: 1px solid #BFDBFE; font-size: 12px; padding: 4px 9px; border-radius: 6px; }
.pdp-title { margin: 0; font-size: 24px; font-weight: 500; line-height: 1.35; color: var(--slate-dark); }
.pdp-meta { display: flex; align-items: center; gap: 14px; margin-top: 12px; font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 13.5px; color: var(--slate-body); flex-wrap: wrap; }
.star { color: var(--amber-text); }
.pill-icon { stroke: currentColor; stroke-width: 2.4; fill: none; flex-shrink: 0; }
.star-ic { width: 13px; height: 13px; vertical-align: -2px; fill: var(--amber-text); flex-shrink: 0; }
.star-ic-lg { width: 15px; height: 15px; vertical-align: -3px; }
.star-ic-empty { fill: none; stroke: var(--amber-text); stroke-width: 1.6; }

.mode-toggle { display: flex; gap: 8px; margin-top: 18px; background: #F1F5F9; padding: 4px; border-radius: 10px; width: max-content; }
.mode-btn { padding: 8px 18px; border-radius: 8px; font-size: 13.5px; cursor: pointer; color: var(--slate-body); }
.mode-btn.active { background: #fff; color: var(--slate-dark); box-shadow: 0 1px 3px rgba(15,23,42,.12); }

.price-box { margin-top: 16px; background: var(--neutral-bg); border: 1px solid var(--border-subtle); border-radius: 12px; padding: 16px; }
.price-big { font-family: 'Satoshi', 'Kanit', sans-serif; font-weight: 900; font-size: 32px; color: var(--slate-dark); }
.price-note { font-size: 12.5px; color: var(--slate-body); margin-top: 6px; }
.disc-pill { background: #FFFBEB; color: var(--amber-text); border: 1px solid #FDE68A; font-family: 'Satoshi', 'Kanit', sans-serif; font-weight: 700; font-size: 12.5px; padding: 3px 8px; border-radius: 6px; }

.tier-table { border: 1px solid var(--border-subtle); border-radius: 12px; overflow: hidden; margin-top: 10px; }
.tier-head { display: grid; grid-template-columns: 1fr 1fr 1fr; background: #F1F5F9; font-size: 12.5px; color: var(--slate-body); padding: 10px 14px; }
.tier-row { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 12px 14px; border-top: 1px solid var(--border-subtle); font-family: 'Satoshi', 'Kanit', sans-serif; font-size: 14px; }
.tier-row.active { background: #EFF6FF; }
.tier-save { color: var(--emerald-verified); }
.notice-green { margin-top: 10px; background: var(--emerald-bg); border: 1px solid var(--emerald-border); color: var(--emerald-verified); font-size: 13px; padding: 10px 12px; border-radius: 9px; }

const IMG_CACHE = new Map();
const IMG_PENDING = new Set();

function commonsSearchUrl(query) {
  const q = encodeURIComponent('filetype:bitmap ' + query);
  return `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${q}&gsrnamespace=6&gsrlimit=1&prop=imageinfo&iiprop=url&iiurlwidth=640&format=json&origin=*`;
}

function applyResolvedImage(query, url) {
  document.querySelectorAll(`img[data-query="${CSS.escape(query)}"]`).forEach(img => { img.src = url; });
}

function resolveRealImage(query) {
  if (IMG_CACHE.has(query) || IMG_PENDING.has(query)) return;
  IMG_PENDING.add(query);
  fetch(commonsSearchUrl(query)).then(r => r.json()).then(data => {
    const pages = data.query && data.query.pages;
    const first = pages && Object.values(pages)[0];
    const info = first && first.imageinfo && first.imageinfo[0];
    const url = info && (info.thumburl || info.url) || null;
    IMG_CACHE.set(query, url);
    IMG_PENDING.delete(query);
    if (url) applyResolvedImage(query, url);
  }).catch(() => { IMG_CACHE.set(query, null); IMG_PENDING.delete(query); });
}

function imgSlot(label, extraClass, query, seed) {
  if (!query) return `<div class="img-slot ${extraClass || ''}">${esc(label)}</div>`;
  const seedStr = encodeURIComponent(query + '-' + String(seed || label));
  const fallback = `https://picsum.photos/seed/${seedStr}/640/640`;
  const src = IMG_CACHE.get(query) || fallback;
  resolveRealImage(query);
  return `<img class="img-slot-photo ${extraClass || ''}" data-extra="${esc(extraClass || '')}" data-query="${esc(query)}" src="${src}" alt="${esc(label)}" loading="lazy">`;
}

function imgErrorFallback(e) {
  const img = e.target;
  if (!img || img.tagName !== 'IMG' || !img.classList.contains('img-slot-photo')) return;
  const div = document.createElement('div');
  div.className = 'img-slot ' + (img.dataset.extra || '');
  div.textContent = img.alt || '';
  img.replaceWith(div);
}

/* ============================== QR GRAPHIC ============================== */

function qrGraphicHtml() {
  const N = 25, seed = 7;
  const inBox = (r, c, r0, c0) => r >= r0 && r < r0 + 7 && c >= c0 && c < c0 + 7;
  const ring = (r, c, r0, c0) => {
    const dr = r - r0, dc = c - c0;
    const edge = dr === 0 || dr === 6 || dc === 0 || dc === 6;
    const core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
    return edge || core;
  };
  const finder = (r, c) => {
    if (inBox(r, c, 0, 0)) return ring(r, c, 0, 0);
    if (inBox(r, c, 0, N - 7)) return ring(r, c, 0, N - 7);
    if (inBox(r, c, N - 7, 0)) return ring(r, c, N - 7, 0);
    return null;
  };
  let cells = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const f = finder(r, c);
      const on = f === null ? ((r * 7 + c * 13 + ((r * c * seed) % 5)) % 3 === 0) : f;
      cells += `<div style="background:${on ? '#1E293B' : 'transparent'}"></div>`;
    }
  }
  return `<div class="qr-grid" style="grid-template-columns:repeat(${N},1fr)">${cells}</div>`;
}

/* ============================== DERIVED VIEW MODEL ============================== */

function view() {
  const st = state;
  const vw = st.vw;
  const pdpWide = vw >= 1180;
  const feedCols = vw < 560 ? 2 : vw < 860 ? 3 : vw < 1120 ? 4 : 5;

  const card = p => {
    const hasDisc = !!p.old;
    return {
      ...p,
      slot: 'img-' + p.id, ph: p.cat,
      priceText: baht(p.price),
      oldText: hasDisc ? baht(p.old) : '',
      hasDisc,
      discText: hasDisc ? '-' + Math.round((1 - p.price / p.old) * 100) + '%' : '',
      soldText: 'ขายแล้ว ' + compact(p.sold),
      ratingText: p.rating.toFixed(1)
    };
  };

  const q = st.query.trim();
  let feedAll = PRODUCTS.filter(p => {
    if (st.cat && p.cat !== st.cat) return false;
    if (!q) return true;
    return (p.name + p.shop + p.province + p.cat).indexOf(q) >= 0;
  });
  const total = feedAll.length;
  const feed = feedAll.slice(0, st.visible).map(card);

  const remain = Math.max(0, flashEnd - st.now);
  const p = find(st.pid);
  const unit = unitPrice(p, st.qty, st.mode);
  const isWholesale = st.mode === 'wholesale';

  const cartItems = st.cart.map(c => {
    const prod = find(c.id);
    const u = unitPrice(prod, c.qty, c.mode);
    return {
      ...prod, key: c.key, qty: c.qty, mode: c.mode,
      unitText: baht(u) + ' / ชิ้น',
      modeText: c.mode === 'wholesale' ? 'ราคาขายส่ง (B2B)' : 'ราคาปลีก (B2C)',
      lineTotal: baht(u * c.qty),
      line: u * c.qty
    };
  });

  const shipFees = { post: 35, flash: 45, kerry: 60 };
  const subtotal = cartItems.reduce((a, b) => a + b.line, 0);
  const shipFee = cartItems.length ? shipFees[st.ship] : 0;
  const discount = st.voucherOk ? Math.round(subtotal * 0.1) : 0;
  const grand = subtotal + shipFee - discount;

  const groups = [];
  cartItems.forEach(it => {
    let g = groups.find(x => x.shop === it.shop);
    if (!g) { g = { shop: it.shop, province: it.province, items: [], voucherText: 'ส่งฟรีเมื่อซื้อครบ ฿500 จากร้านนี้' }; groups.push(g); }
    g.items.push(it);
  });

  const qrRemain = Math.max(0, qrEnd - st.now);

  return {
    st, vw, pdpWide, feedCols, feed, total, q, remain, p, unit, isWholesale,
    cartItems, subtotal, shipFee, discount, grand, groups, qrRemain, card
  };
}

/* ============================== RENDER: HOME ============================== */

function renderHome(vm) {
  const st = vm.st;

  const cdH = Math.floor(vm.remain / 3600e3);
  const cdM = Math.floor(vm.remain / 60e3) % 60;
  const cdS = Math.floor(vm.remain / 1000) % 60;
  _flipPrev.h = cdH; _flipPrev.m = cdM; _flipPrev.s = cdS;

  const flashItems = PRODUCTS.filter(x => x.flash).map(x => {
    const c = vm.card(x);
    const pct = Math.max(8, Math.min(92, Math.round(100 - x.stock / 5)));
    return { ...c, stockPct: pct + '%', stockText: 'เหลือ ' + x.stock + ' ชิ้น' };
  });

  const champions = PRODUCTS.filter(x => st.province === 'ทั้งหมด' || x.province === st.province).slice(0, 4).map(x => ({
    shop: x.shop, province: 'จ.' + x.province, level: 'Level 3',
    blurb: 'ผู้ผลิต' + x.cat + 'ที่ได้รับการคัดเลือกเป็น SME Champion ประจำจังหวัด',
    ratingText: x.rating.toFixed(1), ordersText: compact(x.sold), logoQuery: productQuery(x)
  }));

  const feedTitle = st.cat ? 'หมวด ' + st.cat : (vm.q ? 'ผลการค้นหา "' + vm.q + '"' : 'แนะนำสำหรับคุณ');

  return `
  <div data-screen-label="Home">
    <div class="section">
      <div class="hero-grid">
        <div class="hero-main">
          <div class="hero-track" id="heroTrack" style="transform:translateX(-${st.slide * 100}%)">
            ${HEROES.map((h, i) => `
            <div class="hero-slide">
              ${imgSlot('แบนเนอร์แคมเปญ 1200×500', '', HERO_IMAGES[i], 'hero-banner-' + i)}
              <div class="hero-caption">
                <div class="hero-tag"><svg class="pill-icon" data-lucide="landmark"></svg>แคมเปญรัฐ</div>
                <div class="hero-title">${esc(h.t)}</div>
                <div class="hero-sub">${esc(h.s)}</div>
                <button type="button" class="hero-cta">${esc(h.cta)}<svg class="pill-icon" data-lucide="arrow-right"></svg></button>
              </div>
            </div>`).join('')}
          </div>
          <button type="button" class="hero-arrow hero-arrow-left" data-action="prevSlide" aria-label="ก่อนหน้า"><svg class="pill-icon" data-lucide="chevron-left"></svg></button>
          <button type="button" class="hero-arrow hero-arrow-right" data-action="nextSlide" aria-label="ถัดไป"><svg class="pill-icon" data-lucide="chevron-right"></svg></button>
          <div class="hero-dots" id="heroDots">
            ${HEROES.map((h, i) => `<div class="hero-dot" data-action="pickSlide" data-slide="${i}" style="width:${i === st.slide ? '20px' : '7px'};background:${i === st.slide ? '#FFFFFF' : 'rgba(255,255,255,.5)'}"></div>`).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="section">
      <div class="card cat-grid">
        ${CATS.map(c => `
        <div class="cat-cell${st.cat === c.n ? ' active' : ''}" data-action="pickCategory" data-cat="${esc(c.n)}">
          <div class="cat-glyph"><svg class="lucide-icon" data-lucide="${c.i}"></svg></div>
          <div class="cat-name">${esc(c.n)}</div>
        </div>`).join('')}
      </div>
    </div>

    <div class="section">
      <div class="card" style="overflow:hidden">
        <div class="flash-head">
          <div class="flash-left">
            <span class="flash-badge"><svg class="pill-icon" data-lucide="zap"></svg>ดีลจำกัดเวลา</span>
            <div class="flash-title">แฟลชเซล ประจำวัน</div>
          </div>
          <div class="flash-right">
            <span class="flash-label">สิ้นสุดใน</span>
            <div class="countdown">
              <div class="count-box"><div class="count-num" id="cd-h">${pad(cdH)}</div><div class="count-unit">HRS</div></div>
              <div class="count-box"><div class="count-num" id="cd-m">${pad(cdM)}</div><div class="count-unit">MINS</div></div>
              <div class="count-box"><div class="count-num" id="cd-s">${pad(cdS)}</div><div class="count-unit">SECS</div></div>
            </div>
            <a href="#" class="flash-link">ดูทั้งหมด</a>
          </div>
        </div>
        <div class="flash-scroll">
          ${flashItems.map(p => `
          <div class="product-card flash-card" data-action="openProduct" data-id="${p.id}">
            <div class="disc-badge">${esc(p.discText)}</div>
            <div class="product-media">
              ${imgSlot(p.ph, '', productQuery(p), p.id)}

              <div class="stock-text">${esc(p.stockText)}</div>

    <div class="section">
      <div class="card" style="padding:20px">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap">
          <div>
            <div style="display:flex;align-items:center;gap:9px">
              <span class="verified-dot" style="width:22px;height:22px;font-size:12px">✓</span>
              <span style="font-size:19px;font-weight:600">สสว. Highlight — สุดยอด SME ประจำจังหวัด</span>
            </div>
            <div style="font-size:13px;color:var(--slate-body);margin-top:5px">ผู้ประกอบการที่ผ่านการตรวจสอบจากฐานข้อมูล สสว. ครบทั้ง 77 จังหวัด</div>

            ${shipOptions.map(o => `
            <div class="option-row ${st.ship === o.v ? 'selected' : ''}" data-action="pickShip" data-ship="${o.v}">
              <span class="option-dot"><span class="option-dot-inner"></span></span>
              <div style="flex:1">
                <div class="option-name">${esc(o.name)}</div>
                <div class="option-sub">${esc(o.eta)}</div>
              </div>
              <div class="option-fee">${o.fee}</div>
            </div>`).join('')}

        <div class="summary-card">
          <div class="summary-title">วิธีการชำระเงิน</div>
          <div style="display:flex;flex-direction:column;gap:10px">
            ${payOptions.map(o => `
            <div class="option-row ${st.pay === o.v ? 'selected' : ''}" data-action="pickPay" data-pay="${o.v}">
              <span class="option-dot"><span class="option-dot-inner"></span></span>
              <div style="flex:1">
                <div class="option-name">${esc(o.name)}</div>
                <div class="option-sub">${esc(o.note)}</div>
              </div>
              ${o.badge ? `<span class="option-badge">แนะนำ</span>` : ''}
            </div>`).join('')}
          </div>
        </div>
      </div>

      <div class="summary-card">
        <div class="summary-title">สรุปการชำระเงิน</div>
        <div class="voucher-form">
          <input id="voucherInput" value="${esc(st.voucher)}" placeholder="กรอกโค้ดส่วนลด">
          <button class="voucher-apply" data-action="applyVoucher">ใช้โค้ด</button>
        </div>
        <div class="summary-rows">
          <div class="summary-row"><span class="summary-label">ยอดรวมสินค้า (${vm.cartItems.reduce((a, b) => a + b.qty, 0)} ชิ้น)</span><span class="num">${baht(vm.subtotal)}</span></div>
          <div class="summary-row"><span class="summary-label">ค่าจัดส่ง</span><span class="num">${baht(vm.shipFee)}</span></div>
          <div class="summary-row"><span class="summary-label">ส่วนลด</span><span class="num" style="color:var(--emerald-verified)">${vm.discount ? '−' + baht(vm.discount) : '฿0'}</span></div>
          <div class="summary-divider"></div>
          <div class="summary-total"><span class="summary-total-label">ยอดชำระ</span><span class="summary-total-value">${baht(vm.grand)}</span></div>
        </div>
        <button class="btn btn-primary btn-block" style="margin-top:16px;padding:13px" data-action="payNow">${esc(payLabel)}</button>
        <div class="summary-fineprint">การกดชำระเงินถือว่าคุณยอมรับเงื่อนไขการใช้งานและนโยบายคุ้มครองข้อมูลส่วนบุคคล (PDPA)</div>
      </div>
    </div>
  </div>`;
}

/* ============================== RENDER: QR ============================== */

function renderQr(vm) {
  const qrRemain = vm.qrRemain;
  const qrCountdown = pad(Math.floor(qrRemain / 60e3)) + ':' + pad(Math.floor(qrRemain / 1000) % 60);
  return `
  <div data-screen-label="PromptPay QR" class="qr-screen">
    <div class="qr-card">
      <div class="qr-title">สแกนเพื่อชำระด้วย PromptPay</div>
      <div class="qr-sub">เปิดแอปธนาคารของคุณและสแกน QR ด้านล่าง</div>
      <div class="qr-graphic-wrap">${qrGraphicHtml()}</div>
      <div class="qr-total">${baht(vm.grand)}</div>
      <div class="qr-ref">Ref. ${orderId} · CRC verified</div>
      <div class="qr-status">
        <span class="qr-dot"></span>
        <span class="qr-status-text">กำลังรอการยืนยันการชำระเงิน · หมดอายุใน <b class="num" id="qrCountdownVal" style="color:var(--slate-dark)">${qrCountdown}</b></span>
      </div>
      <button class="btn btn-green btn-block" style="margin-top:16px;padding:13px" data-action="confirmPaid">จำลองการชำระเงินสำเร็จ</button>
      <div class="qr-back" data-action="goCart">ย้อนกลับไปแก้ไขคำสั่งซื้อ</div>
    </div>
  </div>`;
}

/* ============================== RENDER: STORE ============================== */

function renderStore(vm) {
  const st = vm.st;
  const shopName = st.shop || find(st.pid).shop;
  const own = PRODUCTS.filter(x => x.shop === shopName);
  const base = own[0] || PRODUCTS[0];
  const more = PRODUCTS.filter(x => x.cat === base.cat && x.shop !== shopName).slice(0, 4);

  const wrap = (x, key) => ({
    ...x, ph: x.cat,
    priceText: baht(x.price), oldText: x.old ? baht(x.old) : '', hasDisc: !!x.old,
    discText: x.old ? '-' + Math.round((1 - x.price / x.old) * 100) + '%' : '',
    soldText: 'ขายแล้ว ' + compact(x.sold), rating: x.rating.toFixed(1),
    province: 'จ.' + x.province,
    open: () => { setState({ pid: x.id, qty: 1, mode: 'retail', quoteSent: false }); go('pdp'); }
  });

  const storeStats = [
    { k: 'คะแนนร้าน', v: base.rating.toFixed(1) },
    { k: 'ออร์เดอร์', v: compact(own.reduce((a, b) => a + b.sold, 0)) },
    { k: 'ตอบแชท', v: '98%' },
    { k: 'สินค้า', v: own.length }
  ];

  const storeProducts = own.map(wrap);
  const storeMore = more.map(wrap);

  const storeGrid = vm.vw < 560 ? 'repeat(2,minmax(0,1fr))' : vm.vw < 1000 ? 'repeat(3,minmax(0,1fr))' : 'repeat(4,minmax(0,1fr))';
  const storeHeadGrid = vm.vw < 1100 ? 'minmax(0,1fr)' : 'minmax(0,1fr) auto auto';
  const storeBodyGrid = vm.vw < 1000 ? 'minmax(0,1fr)' : '300px minmax(0,1fr)';

  return `
  <div data-screen-label="Store" style="max-width:1280px;margin:0 auto;padding:16px 16px 40px;width:100%">
    <div style="font-size:12.5px;color:var(--slate-body);margin-bottom:14px">
      <span data-action="goHome" style="cursor:pointer;color:var(--brand-blue)">หน้าแรก</span> / ร้านค้า / <span style="color:#334155">${esc(shopName)}</span>
    </div>

    <div class="store-header">
      <div class="store-cover">${imgSlot('ภาพปกร้าน 1280×360', '', 'Thailand shop storefront', 'store-cover-' + base.id)}</div>
      <div class="store-head-content" style="display:grid;grid-template-columns:${storeHeadGrid};gap:20px;align-items:center">
        <div style="display:flex;align-items:center;gap:14px;min-width:0">
          <div class="store-logo-box">${imgSlot('โลโก้ร้าน', '', productQuery(base), 'logo-' + base.id)}</div>
          <div style="min-width:0">
            <div style="font-size:20px;font-weight:600;color:var(--slate-dark)">${esc(shopName)}</div>
            <div style="font-size:13px;color:var(--slate-body);margin-top:3px">จ.${esc(base.province)} · เข้าร่วมแพลตฟอร์มปี 2565</div>
            <div style="display:inline-flex;align-items:center;gap:6px;margin-top:8px;background:#ECFDF5;border:1px solid #A7F3D0;color:#059669;font-size:12px;padding:4px 10px;border-radius:16px">✓ สสว. Verified SME · Level 3</div>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
          ${storeStats.map(s => `
          <div style="background:#F8FAFC;border:1px solid #E2E8F0;border-radius:14px;padding:11px 12px">
            <div style="font-family:'Satoshi','Kanit',sans-serif;font-weight:700;font-size:17px;color:var(--slate-dark)">${esc(s.v)}</div>
            <div style="font-size:11.5px;color:var(--slate-body);margin-top:2px">${esc(s.k)}</div>
          </div>`).join('')}
        </div>
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn btn-primary">ติดตามร้าน</button>
          <button class="btn btn-outline">แชทเลย</button>
        </div>
      </div>
    </div>

    <div class="store-body" style="display:grid;grid-template-columns:${storeBodyGrid};gap:16px;margin-top:16px;align-items:start">
      <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;padding:16px">
        <div style="font-size:15px;font-weight:500;margin-bottom:10px">ข้อมูลร้านค้า</div>
        <div style="font-size:13px;color:var(--slate-body);line-height:1.75">ผู้ประกอบการ SME จากจังหวัด${esc(base.province)} ผลิตและจำหน่าย${esc(base.cat)}ที่ขึ้นทะเบียนกับ สสว. ผ่านการยืนยันตัวตนด้วย SME One ID พร้อมรองรับคำสั่งซื้อทั้งแบบขายปลีกและขายส่งสำหรับองค์กรและการจัดซื้อภาครัฐ</div>
        <div style="margin-top:14px;display:flex;flex-direction:column;gap:0">
          ${[
            { k: 'เลขทะเบียนนิติบุคคล', v: '0105558xxxxx' },
            { k: 'รหัส TSIC', v: '47912' },
            { k: 'ระดับการยืนยัน', v: 'Level 3' },
            { k: 'มาตรฐานที่ได้รับ', v: 'OTOP 5 ดาว, อย.' },
            { k: 'เวลาจัดส่งโดยเฉลี่ย', v: 'ภายใน 1 วัน' }
          ].map(i => `
          <div style="display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #E2E8F0;font-size:12.5px">
            <span style="color:var(--slate-body)">${esc(i.k)}</span>
            <span style="color:var(--slate-dark);text-align:right">${esc(i.v)}</span>
          </div>`).join('')}
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;padding:18px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px">
            <div style="font-size:17px;font-weight:600">สินค้าของร้าน</div>
            <div style="font-size:12.5px;color:var(--slate-body);font-family:'Satoshi','Kanit',sans-serif">${storeProducts.length} รายการ</div>
          </div>
          <div class="products-grid" style="display:grid;gap:14px;grid-template-columns:${storeGrid}">
            ${storeProducts.map(p => `
            <div class="product-card" data-action="openProduct" data-id="${p.id}">
              ${p.hasDisc ? `<div class="disc-badge">${esc(p.discText)}</div>` : ''}
              <div class="product-media">
                ${imgSlot(p.cat, '', productQuery(p), p.id + '-store')}
              </div>
              <div style="padding:11px 12px 13px;display:flex;flex-direction:column;gap:7px;flex:1">
                <div style="font-size:13.5px;color:#334155;line-height:1.4;height:38px;overflow:hidden">${esc(p.name)}</div>
                <div style="display:flex;align-items:baseline;gap:7px;margin-top:auto">
                  <span style="font-family:'Satoshi','Kanit',sans-serif;font-weight:700;font-size:17px;color:var(--slate-dark)">${p.priceText}</span>
                  ${p.hasDisc ? `<span style="font-family:'Satoshi','Kanit',sans-serif;font-size:12px;color:#94A3B8;text-decoration:line-through">${p.oldText}</span>` : ''}
                </div>
                <div style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--slate-body);font-family:'Satoshi','Kanit',sans-serif">
                  ${starIcon()}${p.rating}
                  <span style="color:#CBD5E1">|</span>
                  <span>${p.soldText}</span>
                </div>
              </div>
            </div>`).join('')}
          </div>
        </div>

        ${storeMore.length > 0 ? `
        <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;padding:18px">
          <div style="font-size:17px;font-weight:600;margin-bottom:14px">สินค้าอื่นในหมวด ${esc(base.cat)}</div>
          <div class="products-grid" style="display:grid;gap:14px;grid-template-columns:${storeGrid}">
            ${storeMore.map(p => `
            <div class="product-card" data-action="openProduct" data-id="${p.id}">
              <div class="product-media">
                ${imgSlot(p.cat, '', productQuery(p), p.id + '-more')}
              </div>
              <div style="padding:11px 12px 13px;display:flex;flex-direction:column;gap:6px;flex:1">
                <div style="font-size:13.5px;color:#334155;line-height:1.4;height:38px;overflow:hidden">${esc(p.name)}</div>
                <div style="font-family:'Satoshi','Kanit',sans-serif;font-weight:700;font-size:16px;color:var(--slate-dark);margin-top:auto">${p.priceText}</div>
                <div style="font-size:11.5px;color:var(--slate-body)">${esc(p.shop)} · ${p.province}</div>
              </div>
            </div>`).join('')}
          </div>
        </div>` : ''}
      </div>
    </div>
  </div>`;
}

}

/* ============================== RENDER: RELATED IMAGES ============================== */

function renderRelatedImages(vm) {
  const p = vm.p;
  const pool = PRODUCTS.filter(x => !p || x.id !== p.id);
  const items = (p ? pool.filter(x => x.cat === p.cat).concat(pool) : pool).slice(0, 6);

  return `
  <div class="section" style="padding-bottom:32px">
    <div class="feed-head">
      <div class="feed-title">รูปภาพที่เกี่ยวข้อง</div>
    </div>
    <div class="related-grid">
      ${items.map(x => `
      <div class="related-thumb" data-action="openProduct" data-id="${x.id}">
        ${imgSlot(x.cat, '', productQuery(x), x.id)}
      </div>`).join('')}
    </div>
  </div>`;
}

/* ============================== MAIN RENDER ============================== */

function render() {
  const vm = view();
  const st = vm.st;

  let screenHtml = '';
  if (st.screen === 'home') screenHtml = renderHome(vm);
  else if (st.screen === 'pdp') screenHtml = renderPdp(vm);
  else if (st.screen === 'store') screenHtml = renderStore(vm);
  else if (st.screen === 'cart') screenHtml = renderCart(vm);
  else if (st.screen === 'checkout') screenHtml = renderCheckout(vm);
  else if (st.screen === 'qr') screenHtml = renderQr(vm);
  else if (st.screen === 'paid') screenHtml = renderPaid(vm);

  document.getElementById('app').innerHTML = `
    ${renderHeader(vm)}
    <div style="flex:1">
      ${screenHtml}
      ${renderRelatedImages(vm)}
    </div>
    ${renderFooter()}
    ${renderCookie(st)}
  `;
  if (window.lucide) window.lucide.createIcons();
}

/* ============================== ACTIONS ============================== */

const ACTIONS = {
  goHome: () => { setState({ cat: null, query: '' }); go('home'); },
  goCart: () => go('cart'),
  goCheckout: () => go('checkout'),
  toggleMenu: () => setState(s => ({ menuOpen: !s.menuOpen })),
  closeCookie: () => setState({ cookieOpen: false }),

  pickSuggestion: (el) => {
    const id = el.dataset.id;
    setState({ pid: id, qty: 1, mode: 'retail', query: '' });
    go('pdp');
  },
  pickCategory: (el) => {
    const cat = el.dataset.cat;
    setState({ cat, query: '', visible: 10, menuOpen: false, screen: 'home' });
    window.scrollTo(0, 520);
  },
  pickSlide: (el) => goToSlide(Number(el.dataset.slide)),
  prevSlide: () => goToSlide((state.slide + HEROES.length - 1) % HEROES.length),
  nextSlide: () => goToSlide((state.slide + 1) % HEROES.length),
  pickProvince: (el) => setState({ province: el.dataset.province }),
  loadMore: () => setState(s => ({ visible: s.visible + 5 })),
  openProduct: (el) => {
    setState({ pid: el.dataset.id, qty: 1, mode: 'retail', quoteSent: false });
    go('pdp');
  },

  setRetail: () => setState({ mode: 'retail', qty: 1 }),
  setWholesale: () => setState({ mode: 'wholesale', qty: 10 }),
  requestQuote: () => setState({ quoteSent: true }),
  incQty: () => setState(s => ({ qty: Math.min(find(s.pid).stock, s.qty + 1) })),
  decQty: () => setState(s => ({ qty: Math.max(1, s.qty - 1) })),
  addToCart: () => addItem(find(state.pid), state.qty, state.mode),
  buyNow: () => { addItem(find(state.pid), state.qty, state.mode); go('cart'); },
  pickReviewFilter: (el) => setState({ reviewFilter: el.dataset.filter }),
  visitStore: (el) => { setState({ shop: el.dataset.shop }); go('store'); },

  cartInc: (el) => setState(s => ({ cart: s.cart.map(x => x.key === el.dataset.key ? { ...x, qty: x.qty + 1 } : x) })),
  cartDec: (el) => setState(s => ({ cart: s.cart.map(x => x.key === el.dataset.key ? { ...x, qty: Math.max(1, x.qty - 1) } : x) })),
  cartRemove: (el) => setState(s => ({ cart: s.cart.filter(x => x.key !== el.dataset.key) })),

  pickShip: (el) => setState({ ship: el.dataset.ship }),
  pickPay: (el) => setState({ pay: el.dataset.pay }),
  applyVoucher: () => setState({ voucherOk: true }),
  payNow: () => { qrEnd = Date.now() + 15 * 60e3; go(state.pay === 'promptpay' ? 'qr' : 'paid'); },
  confirmPaid: () => { setState({ cart: [] }); go('paid'); }
};

/* ============================== EVENT DELEGATION ============================== */

function initEvents() {
  const app = document.getElementById('app');

  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el);
  });

  app.addEventListener('input', (e) => {
    if (e.target.id === 'searchInput') {
      setState({ query: e.target.value, visible: 10, cat: null, screen: 'home' });
      const input = document.getElementById('searchInput');
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
    } else if (e.target.id === 'voucherInput') {
      state.voucher = e.target.value;
    }
  });

  app.addEventListener('change', (e) => {
    if (e.target.id === 'shipToSelect') setState({ shipTo: e.target.value });
  });

  app.addEventListener('error', imgErrorFallback, true);
}

/* ============================== BOOT ============================== */

function goToSlide(index) {
  // Patch the track transform and dots in place instead of a full
  // setState()/render() — a full rebuild would swap in a brand-new
  // track element with the end transform already set, so the CSS
  // transition would have nothing to animate from and the slide
  // would just cut instead of sliding.
  state.slide = index;
  const track = document.getElementById('heroTrack');
  if (track) track.style.transform = `translateX(-${index * 100}%)`;
  const dots = document.getElementById('heroDots');
  if (dots) {
    dots.querySelectorAll('.hero-dot').forEach((d, i) => {
      d.style.width = i === index ? '20px' : '7px';
      d.style.background = i === index ? '#FFFFFF' : 'rgba(255,255,255,.5)';
    });
  }
}

function updateFlipDigit(id, text, changed) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  if (changed) {
    el.classList.remove('flip');
    void el.offsetWidth; // restart the animation
    el.classList.add('flip');
  }
}

function tickCountdowns() {
  // Patch just the countdown digits in place instead of doing a full
  // setState()/render() every second — a full innerHTML rebuild would
  // tear down and recreate every card each tick, which visibly breaks
  // (blinks) the :hover state of whatever card the pointer is over.
  const nowTs = Date.now();
  state.now = nowTs;

  if (state.screen === 'home') {
    const remain = Math.max(0, flashEnd - nowTs);
    const h = Math.floor(remain / 3600e3);
    const m = Math.floor(remain / 60e3) % 60;
    const s = Math.floor(remain / 1000) % 60;
    updateFlipDigit('cd-h', pad(h), _flipPrev.h !== null && _flipPrev.h !== h);
    updateFlipDigit('cd-m', pad(m), _flipPrev.m !== null && _flipPrev.m !== m);
    updateFlipDigit('cd-s', pad(s), _flipPrev.s !== null && _flipPrev.s !== s);
    _flipPrev.h = h; _flipPrev.m = m; _flipPrev.s = s;
  } else if (state.screen === 'qr') {
    const el = document.getElementById('qrCountdownVal');
    if (el) {
      const qrRemain = Math.max(0, qrEnd - nowTs);
      el.textContent = pad(Math.floor(qrRemain / 60e3)) + ':' + pad(Math.floor(qrRemain / 1000) % 60);
    }
  }
}

function boot() {
  initEvents();
  render();
  setInterval(tickCountdowns, 1000);
  setInterval(() => { if (state.screen === 'home') goToSlide((state.slide + 1) % HEROES.length); }, 6000);
  window.addEventListener('resize', () => setState({ vw: window.innerWidth }));
}

document.addEventListener('DOMContentLoaded', boot);

</script>
</body>
</html>
